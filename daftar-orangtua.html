
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Orang Tua - PPTQ Al-Ittihad</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}
header {
    background: #14532d;
    color: white;
    text-align: center;
    padding: 22px;
}
.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 15px;
}
.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
}
label {
    display: block;
    margin-top: 15px;
}
input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}
button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #166534;
    color: white;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}
#pesan { margin-top: 15px; }
</style>
</head>
<body>

<header>
<h2>PENDAFTARAN ORANG TUA</h2>
<p>PPTQ AL-ITTIHAD MALAKKE BELAWA</p>
</header>

<div class="container">
<div class="card">
<h3>Formulir Pendaftaran Akun</h3>

<form id="formDaftar">
<label>Nama Lengkap Orang Tua</label>
<input type="text" id="nama" required>

<label>Nomor WhatsApp</label>
<input type="tel" id="hp" required>

<label>Email Aktif</label>
<input type="email" id="email" required>

<label>Kata Sandi (minimal 8 karakter)</label>
<input type="password" id="password" minlength="8" required>

<label>Konfirmasi Kata Sandi</label>
<input type="password" id="konfirmasi" minlength="8" required>

<button type="submit" id="tombol">DAFTAR SEKARANG</button>
</form>

<p id="pesan"></p>
<p><a href="login-orangtua.html">Sudah punya akun? Login di sini.</a></p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
    "https://cpdkqqxvjfbcoucelhmr.supabase.co",
    "sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2"
);

document.getElementById("formDaftar")
.addEventListener("submit", async function(e) {
    e.preventDefault();

    const nama = document.getElementById("nama").value.trim();
    const hp = document.getElementById("hp").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const konfirmasi = document.getElementById("konfirmasi").value;
    const pesan = document.getElementById("pesan");
    const tombol = document.getElementById("tombol");

    if (password !== konfirmasi) {
        pesan.textContent = "Konfirmasi kata sandi tidak sama.";
        return;
    }

    tombol.disabled = true;
    tombol.textContent = "MEMPROSES PENDAFTARAN...";
    pesan.textContent = "";

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                nama_orang_tua: nama,
                no_hp: hp
            }
        }
    });

    tombol.disabled = false;
    tombol.textContent = "DAFTAR SEKARANG";

    if (error) {
        pesan.textContent = "Pendaftaran gagal: " + error.message;
        return;
    }

    if (data.user && data.session) {
        await supabaseClient.auth.signOut();
        pesan.textContent =
            "Pendaftaran berhasil. Silakan periksa email untuk konfirmasi. Setelah itu tunggu persetujuan admin.";
    } else {
        pesan.textContent =
            "Pendaftaran berhasil. Silakan periksa email untuk konfirmasi akun. Setelah itu tunggu persetujuan admin.";
    }

    this.reset();
});
</script>

</body>
</html>
