<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir Kantin QR - Keranjang Belanja</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#1e293b}.wrap{max-width:850px;margin:22px auto;padding:14px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0001}h1,h2{color:#14532d}input,button,select{width:100%;padding:12px;border-radius:8px;font-size:15px;margin-top:9px}input,select{border:1px solid #cbd5e1}button{border:0;background:#166534;color:white;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#475569}.danger{background:#b91c1c}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:9px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.prod strong{display:block}.price,.total{color:#166534;font-weight:bold}.prod button{width:auto;min-width:90px;margin:0}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #e2e8f0;padding:10px 0}.qty{display:flex;gap:6px;align-items:center}.qty button{width:36px;padding:8px;margin:0}.qty span{min-width:22px;text-align:center}.saldo{font-size:24px;font-weight:bold;color:#166534}#reader{width:100%;margin-top:10px}#studentBox,#work,#catalog,#cartCard{display:none}#pesan{white-space:pre-wrap;margin-top:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.prod{grid-template-columns:1fr}.prod button{width:100%}}
</style></head><body><main class="wrap">
<section class="card"><h1>Kasir Kantin PPTQ Al-Ittihad</h1><p class="muted">Pindai QR santri, pilih beberapa produk, lalu bayar dari saldo tabungan.</p>
<div id="loginBox"><input id="email" type="email" placeholder="Email petugas" autocomplete="username"><input id="password" type="password" placeholder="Kata sandi" autocomplete="current-password"><button id="login">LOGIN PETUGAS</button></div>
<div id="work"><p id="status"></p><button class="secondary" id="logout">KELUAR</button></div><p id="pesan"></p></section>
<section class="card" id="studentBox"><h2>Identitas Santri</h2><strong id="nama"></strong><p id="identitas" class="muted"></p><div>Saldo tersedia</div><div id="saldo" class="saldo"></div><button class="secondary" id="scanAgain">PINDAI SANTRI LAIN</button></section>
<section class="card" id="catalog"><h2>Pilih Produk</h2><p class="muted">Pilih beberapa barang. Harga diambil langsung dari katalog kantin.</p><div id="products"></div></section>
<section class="card" id="cartCard"><h2>Keranjang Belanja</h2><div id="cart"></div><div class="line total"><span>TOTAL BELANJA</span><span id="total"></span></div><button id="checkout">KONFIRMASI & BAYAR</button><button class="danger" id="clearCart">KOSONGKAN KERANJANG</button></section>
<section class="card" id="scanCard" style="display:none"><h2>Pindai Kartu QR Santri</h2><div id="reader"></div><button id="startScan">MULAI PINDAI QR</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://cpdkqqxvjfbcoucelhmr.supabase.co","sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2");
const el=id=>document.getElementById(id);const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
let scanner=null,token=null,student=null,products=[],cart=new Map();
function msg(t){el("pesan").textContent=t}
async function stopScan(){if(scanner){try{if(scanner.isScanning)await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
let scannerLibraryPromise=null;\nfunction loadScannerLibrary(){if(window.Html5Qrcode)return Promise.resolve();if(scannerLibraryPromise)return scannerLibraryPromise;msg("Menyiapkan pemindai QR...");scannerLibraryPromise=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";s.onload=()=>window.Html5Qrcode?resolve():reject(new Error("Library pemindai tidak ditemukan."));s.onerror=()=>reject(new Error("Gagal mengunduh pemindai. Periksa koneksi internet."));document.head.appendChild(s)});return scannerLibraryPromise}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data:p,error}=await db.from("profil_pengguna").select("nama,peran").eq("id",session.user.id).single();if(error||!p||!["admin","petugas_kantin"].includes(p.peran)){await db.auth.signOut();msg("Akun tidak memiliki akses kasir.");return}el("loginBox").style.display="none";el("work").style.display="block";el("status").textContent="Login: "+p.nama+" ("+p.peran+")";el("scanCard").style.display="block";await loadProducts()}
el("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(error){msg("Login gagal: "+error.message);return}await init()};
el("logout").onclick=async()=>{await stopScan();await db.auth.signOut();location.reload()};
async function loadProducts(){const {data,error}=await db.from("produk_kantin").select("id,nama_produk,kategori,harga").eq("aktif",true).order("nama_produk");if(error){msg("Gagal memuat produk: "+error.message);return}products=data||[];renderProducts()}
function renderProducts(){el("products").innerHTML="";if(!products.length){el("products").textContent="Belum ada produk aktif.";return}products.forEach(p=>{const box=document.createElement("div");box.className="prod";const info=document.createElement("div");const name=document.createElement("strong");name.textContent=p.nama_produk;const meta=document.createElement("div");meta.className="muted";meta.textContent=p.kategori;const price=document.createElement("div");price.className="price";price.textContent=rupiah(p.harga);info.append(name,meta,price);const add=document.createElement("button");add.textContent="TAMBAH";add.onclick=()=>addItem(p.id);box.append(info,add);el("products").append(box)})}
function addItem(id){const old=cart.get(id);cart.set(id,{product:products.find(p=>p.id===id),qty:old?old.qty+1:1});renderCart()}
function renderCart(){el("cart").innerHTML="";let total=0;cart.forEach((item,id)=>{const sub=Number(item.product.harga)*item.qty;total+=sub;const line=document.createElement("div");line.className="line";const info=document.createElement("div");const name=document.createElement("strong");name.textContent=item.product.nama_produk;const detail=document.createElement("div");detail.className="muted";detail.textContent=rupiah(item.product.harga)+" × "+item.qty+" = "+rupiah(sub);info.append(name,detail);const controls=document.createElement("div");controls.className="qty";const minus=document.createElement("button");minus.textContent="−";minus.onclick=()=>changeQty(id,-1);const qty=document.createElement("span");qty.textContent=item.qty;const plus=document.createElement("button");plus.textContent="+";plus.onclick=()=>changeQty(id,1);controls.append(minus,qty,plus);line.append(info,controls);el("cart").append(line)});el("total").textContent=rupiah(total);el("cartCard").style.display=cart.size?"block":"none";el("checkout").disabled=!student||!cart.size}
function changeQty(id,d){const item=cart.get(id);if(!item)return;item.qty+=d;if(item.qty<=0)cart.delete(id);else cart.set(id,item);renderCart()}
el("clearCart").onclick=()=>{cart.clear();renderCart()};
async function scanResult(decoded){await stopScan();token=decoded;msg("Memeriksa kartu QR...");const {data,error}=await db.rpc("pratinjau_pembayaran_qr",{p_token:token});if(error){token=null;msg("QR tidak dapat digunakan: "+error.message);return}student=data&&data[0];if(!student){token=null;msg("Data santri tidak ditemukan.");return}el("nama").textContent=student.nama_lengkap;el("identitas").textContent="NIS: "+student.nis+" · Kelas: "+(student.kelas||"-");el("saldo").textContent=rupiah(student.saldo);el("studentBox").style.display="block";el("catalog").style.display="block";msg("QR valid. Pastikan nama santri benar.");renderCart()}
el("startScan").onclick=async()=>{const btn=el("startScan");btn.disabled=true;btn.textContent="MENYIAPKAN KAMERA...";try{await loadScannerLibrary();await stopScan();scanner=new Html5Qrcode("reader",{verbose:false});msg("Meminta akses kamera. Jika muncul pertanyaan, pilih Izinkan.");await scanner.start({facingMode:"environment"},{fps:8,qrbox:{width:220,height:220},aspectRatio:1},scanResult,()=>{});msg("Kamera siap. Arahkan QR ke dalam kotak pemindai.");}catch(e){msg("Kamera belum dapat dibuka: "+(e&&e.message?e.message:e)+". Pastikan izin kamera aktif, tutup aplikasi kamera lain, dan gunakan HTTPS.");await stopScan()}finally{btn.disabled=false;btn.textContent="MULAI PINDAI QR"}};
el("scanAgain").onclick=async()=>{await stopScan();token=null;student=null;cart.clear();el("studentBox").style.display="none";el("catalog").style.display="none";renderCart();msg("Silakan pindai QR santri berikutnya.")};
el("checkout").onclick=async()=>{if(!student||!token||!cart.size){msg("Pindai QR dan pilih produk terlebih dahulu.");return}const items=Array.from(cart.values()).map(x=>({product_id:x.product.id,quantity:x.qty}));const total=items.reduce((s,x)=>{const p=products.find(y=>y.id===x.product_id);return s+Number(p.harga)*x.quantity},0);if(total>Number(student.saldo)){msg("Saldo tidak mencukupi. Saldo tersedia: "+rupiah(student.saldo));return}const summary=Array.from(cart.values()).map(x=>x.product.nama_produk+" × "+x.qty).join("\n");if(!confirm("Santri: "+student.nama_lengkap+"\n"+summary+"\n\nTotal: "+rupiah(total)+"\n\nLanjutkan pembayaran?"))return;el("checkout").disabled=true;msg("Memproses pembayaran...");const {data,error}=await db.rpc("proses_keranjang_kantin_qr",{p_token:token,p_items:items});el("checkout").disabled=false;if(error){msg("Pembayaran gagal: "+error.message);return}msg("PEMBAYARAN BERHASIL\nNomor transaksi: "+data+"\nTotal: "+rupiah(total)+"\nSaldo telah dipotong dan rincian barang tersimpan.");cart.clear();renderCart();await el("scanAgain").onclick()};
init();
</script></body></html>
