<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buku Tabungan Digital | PPTQ Al-Ittihad</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#24352c;font-family:Arial,sans-serif}header{background:#075333;color:white;padding:24px 16px;text-align:center}main{max-width:950px;margin:22px auto;padding:0 14px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}.account{background:linear-gradient(135deg,#075333,#16845b);color:white;padding:20px;border-radius:12px}.number{font-size:25px;font-weight:bold;letter-spacing:1px;margin-top:8px}.balance{font-size:27px;font-weight:bold;color:#075333}.muted{color:#68766e;font-size:13px}button{background:#075333;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}input{width:100%;padding:12px;border:1px solid #ccd5ce;border-radius:8px;margin:7px 0 14px}table{border-collapse:collapse;width:100%;min-width:500px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#e8f2eb}.scroll{overflow:auto}.error{color:#a22}.hidden{display:none}
</style></head><body>
<header><h2 style="margin:0;color:white">BUKU TABUNGAN DIGITAL</h2><p>PPTQ AL-ITTIHAD MALAKKE BELAWA</p></header><main>
<section class="card" id="login"><h3>Login Nasabah</h3><p class="muted">Gunakan email dan kata sandi akun yang telah ditautkan oleh administrator ke rekening Anda.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Kata sandi</label><input id="password" type="password" required><button>Masuk</button></form><p id="loginMsg" class="error"></p></section>
<section id="app" class="hidden"><div class="card"><button style="float:right" onclick="logout()">Keluar</button><h3>Rekening Saya</h3><p id="who" class="muted"></p><div style="clear:both"></div></div><div id="accounts"></div><p id="msg" class="error"></p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://cpdkqqxvjfbcoucelhmr.supabase.co","sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2");
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){document.getElementById("loginMsg").textContent="Login gagal. Periksa email dan kata sandi.";return;}await load();});
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById("login").classList.remove("hidden");document.getElementById("app").classList.add("hidden");return;}document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("who").textContent="Rekening yang ditautkan ke akun: "+session.user.email;
const {data:rows,error}=await db.from("bank_rekening").select("id,kelompok,nomor_rekening,nama_pemilik,status").eq("owner_user_id",session.user.id).eq("status","aktif").order("id");if(error){document.getElementById("msg").textContent="Tidak dapat memuat rekening: "+error.message;return;}const root=document.getElementById("accounts");root.innerHTML="";if(!rows?.length){root.innerHTML='<div class="card">Belum ada rekening yang ditautkan ke akun ini. Silakan hubungi admin pesantren.</div>';return;}
for(const a of rows){const {data:tx,error:te}=await db.from("bank_transaksi").select("tanggal,jenis,jumlah,keterangan").eq("rekening_id",a.id).order("tanggal",{ascending:false});if(te){document.getElementById("msg").textContent="Riwayat belum dapat dimuat: "+te.message;continue;}const saldo=(tx||[]).reduce((s,t)=>s+(t.jenis==="setoran"?1:-1)*Number(t.jumlah),0);const totalIn=(tx||[]).filter(t=>t.jenis==="setoran").reduce((s,t)=>s+Number(t.jumlah),0);const totalOut=(tx||[]).filter(t=>t.jenis==="penarikan").reduce((s,t)=>s+Number(t.jumlah),0);const trs=(tx||[]).map(t=>'<tr><td>'+esc(new Date(t.tanggal).toLocaleDateString("id-ID"))+'</td><td>'+esc(t.jenis)+'</td><td>'+rp(t.jumlah)+'</td><td>'+esc(t.keterangan||"-")+'</td></tr>').join("");const card=document.createElement("div");card.className="card";card.innerHTML='<div class="account"><div>BUKU REKENING NASABAH</div><h3 style="color:white;margin:8px 0">'+esc(a.nama_pemilik)+'</h3><div style="font-size:12px">NOMOR REKENING</div><div class="number">'+esc(a.nomor_rekening||"-")+'</div><div style="margin-top:8px;font-size:13px">Kelompok: '+esc(a.kelompok)+'</div></div><h3>Saldo: <span class="balance">'+rp(saldo)+'</span></h3><p class="muted">Total setoran: '+rp(totalIn)+' · Total penarikan: '+rp(totalOut)+'</p><h3>Riwayat Transaksi</h3><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>'+(trs||'<tr><td colspan="4">Belum ada transaksi.</td></tr>')+'</tbody></table></div><p><button onclick="window.print()">Cetak Buku Tabungan</button></p>';root.appendChild(card);}}
async function logout(){await db.auth.signOut();location.reload();}load();
</script></body></html>
