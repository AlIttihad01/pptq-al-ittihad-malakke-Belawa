<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Bank Mini Al-Ittihad</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,sans-serif;color:#1e293b}
.card{background:white;width:min(92%,420px);padding:28px;border-radius:14px;box-shadow:0 4px 18px #0001}
h2{color:#075333;text-align:center}label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;background:#08734b;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}#pesan{line-height:1.5}a{color:#08734b}
</style></head><body><main class="card">
<h2>BANK MINI AL-ITTIHAD</h2><p style="text-align:center">Login Pemohon Pembiayaan</p>
<form id="formLogin">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Kata sandi</label><input id="password" type="password" autocomplete="current-password" required>
<button id="tombol" type="submit">MASUK</button>
</form><p id="pesan" role="status" aria-live="polite"></p>
<p>Belum punya akun? <a href="daftar-akun-bank-mini.html">Daftar akun masyarakat umum</a></p>
<p><a href="index.html">Kembali ke website pesantren</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient("https://cpdkqqxvjfbcoucelhmr.supabase.co","sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2");
document.getElementById("formLogin").addEventListener("submit",async e=>{
 e.preventDefault();const tombol=document.getElementById("tombol"),pesan=document.getElementById("pesan");
 tombol.disabled=true;tombol.textContent="MEMERIKSA AKUN...";pesan.textContent="";
 const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
 if(error){pesan.textContent="Login gagal. Periksa email, kata sandi, atau konfirmasi email Anda.";tombol.disabled=false;tombol.textContent="MASUK";return;}
 window.location.href="pengajuan-pembiayaan.html";
});
</script></body></html>
