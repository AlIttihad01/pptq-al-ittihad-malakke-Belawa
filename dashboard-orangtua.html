
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Orang Tua - PPTQ Al-Ittihad</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}
header {
    background: #14532d;
    color: white;
    padding: 22px;
    text-align: center;
}
.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}
.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
}
button {
    background: #b91c1c;
    color: white;
    border: 0;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}
th {
    background: #dcfce7;
}
.table-wrap {
    overflow-x: auto;
}
.saldo {
    color: #166534;
    font-size: 25px;
    font-weight: bold;
}
.pesan {
    color: #b91c1c;
}
</style>
</head>

<body>

<header>
    <h2>DASHBOARD ORANG TUA</h2>
    <p>PPTQ AL-ITTIHAD MALAKKE BELAWA</p>
</header>

<div class="container">

    <div class="card">
        <h3>Assalamu'alaikum</h3>
        <p id="namaOrangTua">Memeriksa akun...</p>
        <button onclick="keluar()">KELUAR</button>
    </div>

    <div id="daftarAnak">
        <div class="card">Memuat data anak...</div>
    </div>

    <p id="pesan" class="pesan"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://cpdkqqxvjfbcoucelhmr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function rupiah(nilai) {
    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(Number(nilai) || 0);
}
function amanCetak(teks) {
    return String(teks ?? "").replace(/[&<>"']/g, huruf => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[huruf]);
}

function cetakLaporan(s, riwayat, saldo) {
    const jendela = window.open("", "_blank");

    if (!jendela) {
        alert("Izinkan pop-up agar laporan dapat dicetak.");
        return;
    }

    const baris = riwayat.map(t => `
        <tr>
            <td>${amanCetak(new Date(t.tanggal).toLocaleDateString("id-ID"))}</td>
            <td>${amanCetak(t.jenis)}</td>
            <td>${amanCetak(rupiah(t.jumlah))}</td>
            <td>${amanCetak(t.keterangan || "-")}</td>
        </tr>
    `).join("");

    jendela.document.write(`
        <html>
        <head>
            <title>Laporan Tabungan Santri</title>
            <style>
                body { font-family: Arial; padding: 25px; }
                h2, p { text-align: center; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th, td { border: 1px solid #555; padding: 8px; text-align: left; }
                th { background: #eee; }
                .saldo { font-weight: bold; margin-top: 20px; }
            </style>
        </head>
        <body>
            <h2>LAPORAN TABUNGAN SANTRI</h2>
            <p>PPTQ AL-ITTIHAD MALAKKE BELAWA</p>
            <hr>
            <p style="text-align:left">
                Nama: ${amanCetak(s.nama_lengkap)}<br>
                NIS: ${amanCetak(s.nis)}<br>
                Kelas: ${amanCetak(s.kelas || "-")}
            </p>
            <table>
                <tr>
                    <th>Tanggal</th>
                    <th>Jenis</th>
                    <th>Jumlah</th>
                    <th>Keterangan</th>
                </tr>
                ${baris}
            </table>
            <p class="saldo">Saldo Akhir: ${amanCetak(rupiah(saldo))}</p>
            <p style="text-align:left">Dicetak pada: ${new Date().toLocaleDateString("id-ID")}</p>
        </body>
        </html>
    `);

    jendela.document.close();
    jendela.focus();
    jendela.print();
}

    
async function muatDashboard() {
    const daftar = document.getElementById("daftarAnak");
    const pesan = document.getElementById("pesan");

    const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
        window.location.href = "login-orangtua.html";
        return;
    }

    const user = sessionData.session.user;

    const { data: orangTua, error: errorOrangTua } =
        await supabaseClient
        .from("orang_tua")
        .select("id, nama_orang_tua")
        .eq("user_id", user.id)
        .maybeSingle();

    if (errorOrangTua || !orangTua) {
        daftar.textContent = "Profil orang tua belum ditemukan.";
        return;
    }

    document.getElementById("namaOrangTua").textContent =
        "Bapak/Ibu " + orangTua.nama_orang_tua;

    const { data: relasi, error: errorRelasi } =
        await supabaseClient
        .from("orang_tua_santri")
        .select("santri_id")
        .eq("orang_tua_id", orangTua.id);

    if (errorRelasi) {
        daftar.textContent = "Gagal memuat hubungan data santri.";
        pesan.textContent = errorRelasi.message;
        return;
    }

    if (!relasi || relasi.length === 0) {
        daftar.textContent = "Belum ada santri yang terhubung.";
        return;
    }

    const ids = relasi.map(r => r.santri_id);

    const { data: santri, error: errorSantri } =
        await supabaseClient
        .from("santri")
        .select("id, nis, nama_lengkap, kelas")
        .in("id", ids);

    if (errorSantri) {
        daftar.textContent = "Gagal memuat data anak.";
        pesan.textContent = errorSantri.message;
        return;
    }

    const { data: transaksi, error: errorTransaksi } =
        await supabaseClient
        .from("transaksi_tabungan")
        .select("santri_id, tanggal, jenis, jumlah, keterangan")
        .in("santri_id", ids)
        .order("tanggal", { ascending: false });

    if (errorTransaksi) {
        daftar.textContent = "Gagal memuat riwayat tabungan.";
        pesan.textContent = errorTransaksi.message;
        return;
    }

    daftar.innerHTML = "";

    for (const s of santri) {
        const riwayat = (transaksi || []).filter(
            t => t.santri_id === s.id
        );

        const saldo = riwayat.reduce((total, t) => {
            return total + (
                t.jenis === "setoran"
                ? Number(t.jumlah)
                : -Number(t.jumlah)
            );
        }, 0);

        const card = document.createElement("div");
        card.className = "card";

        const judul = document.createElement("h3");
        judul.textContent = s.nama_lengkap;
        card.appendChild(judul);

        const identitas = document.createElement("p");
        identitas.textContent =
            "NIS: " + s.nis + " | Kelas: " + (s.kelas || "-");
        card.appendChild(identitas);

        const label = document.createElement("h4");
        label.textContent = "Saldo Tabungan";
        card.appendChild(label);

        const nilai = document.createElement("div");
        nilai.className = "saldo";
        nilai.textContent = rupiah(saldo);
        card.appendChild(nilai);
const tombolCetak = document.createElement("button");
tombolCetak.textContent = "🖨️ CETAK LAPORAN TABUNGAN";
tombolCetak.style.background = "#166534";
tombolCetak.style.color = "white";
tombolCetak.style.padding = "10px 15px";
tombolCetak.style.border = "none";
tombolCetak.style.borderRadius = "6px";
tombolCetak.style.cursor = "pointer";
tombolCetak.style.marginTop = "10px";

tombolCetak.onclick = () => cetakLaporan(s, riwayat, saldo);

card.appendChild(tombolCetak);
        const subjudul = document.createElement("h4");
        subjudul.textContent = "Riwayat Transaksi";
        card.appendChild(subjudul);

        const pembungkus = document.createElement("div");
        pembungkus.className = "table-wrap";

        const tabel = document.createElement("table");
        const kepala = document.createElement("thead");
        const barisKepala = document.createElement("tr");

        ["Tanggal", "Jenis", "Jumlah", "Keterangan"].forEach(teks => {
            const th = document.createElement("th");
            th.textContent = teks;
            barisKepala.appendChild(th);
        });

        kepala.appendChild(barisKepala);
        tabel.appendChild(kepala);

        const badan = document.createElement("tbody");

        if (riwayat.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 4;
            td.textContent = "Belum ada transaksi.";
            tr.appendChild(td);
            badan.appendChild(tr);
        } else {
            riwayat.forEach(t => {
                const tr = document.createElement("tr");

                const tanggal =
                    new Date(t.tanggal).toLocaleDateString("id-ID");

                [
                    tanggal,
                    t.jenis === "setoran" ? "Setoran" : "Penarikan",
                    rupiah(t.jumlah),
                    t.keterangan || "-"
                ].forEach(teks => {
                    const td = document.createElement("td");
                    td.textContent = teks;
                    tr.appendChild(td);
                });

                badan.appendChild(tr);
            });
        }

        tabel.appendChild(badan);
        pembungkus.appendChild(tabel);
        card.appendChild(pembungkus);

        const judulBelanja = document.createElement("h4");
        judulBelanja.textContent = "Riwayat Belanja Kantin";
        card.appendChild(judulBelanja);
        const areaBelanja = document.createElement("div");
        areaBelanja.textContent = "Memuat riwayat belanja...";
        card.appendChild(areaBelanja);

        const { data: belanja, error: errorBelanja } = await supabaseClient
            .from("transaksi_kantin")
            .select("id, jumlah, tanggal, keterangan")
            .eq("santri_id", s.id)
            .order("tanggal", { ascending: false })
            .limit(30);

        if (errorBelanja) {
            areaBelanja.textContent = "Riwayat belanja belum dapat dimuat: " + errorBelanja.message;
        } else if (!belanja || belanja.length === 0) {
            areaBelanja.textContent = "Belum ada transaksi belanja kantin.";
        } else {
            const totalBelanja = belanja.reduce((sum, x) => sum + Number(x.jumlah || 0), 0);
            const ringkasan = document.createElement("p");
            ringkasan.className = "saldo";
            ringkasan.textContent = "Total belanja pada 30 transaksi terakhir: " + rupiah(totalBelanja);
            areaBelanja.innerHTML = "";
            areaBelanja.appendChild(ringkasan);

            const tabelBelanja = document.createElement("table");
            const theadBelanja = document.createElement("thead");
            const trHead = document.createElement("tr");
            ["Tanggal", "Barang dibeli", "Total"].forEach(label => {
                const th = document.createElement("th");
                th.textContent = label;
                trHead.appendChild(th);
            });
            theadBelanja.appendChild(trHead);
            tabelBelanja.appendChild(theadBelanja);
            const tbodyBelanja = document.createElement("tbody");

            for (const b of belanja) {
                const { data: rincian, error: errorRincian } = await supabaseClient
                    .from("transaksi_kantin_item")
                    .select("nama_produk, jumlah, subtotal")
                    .eq("transaksi_kantin_id", b.id);

                const tr = document.createElement("tr");
                const tdTanggal = document.createElement("td");
                tdTanggal.textContent = new Date(b.tanggal).toLocaleString("id-ID");
                const tdBarang = document.createElement("td");
                if (errorRincian) {
                    tdBarang.textContent = "Rincian belum dapat dimuat";
                } else if (rincian && rincian.length) {
                    tdBarang.textContent = rincian.map(x => x.nama_produk + " × " + x.jumlah).join(", ");
                } else {
                    tdBarang.textContent = b.keterangan || "Transaksi kantin";
                }
                const tdTotal = document.createElement("td");
                tdTotal.textContent = rupiah(b.jumlah);
                tr.append(tdTanggal, tdBarang, tdTotal);
                tbodyBelanja.appendChild(tr);
            }
            tabelBelanja.appendChild(tbodyBelanja);
            const wrapBelanja = document.createElement("div");
            wrapBelanja.className = "table-wrap";
            wrapBelanja.appendChild(tabelBelanja);
            areaBelanja.appendChild(wrapBelanja);
        }

        daftar.appendChild(card);
    }
}

async function keluar() {
    await supabaseClient.auth.signOut();
    window.location.href = "login-orangtua.html";
}

muatDashboard();
</script>

</body>
</html>
