<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Kantin - PPTQ Al-Ittihad</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#1e293b}.wrap{max-width:1100px;margin:22px auto;padding:14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #0001}h1,h2{color:#14532d}.muted{color:#64748b;font-size:13px}input,button{padding:11px;border-radius:8px;font-size:14px;margin-top:7px}input{border:1px solid #cbd5e1;width:100%}button{border:0;background:#166534;color:white;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#475569}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f0fdf4;padding:14px;border-radius:10px}.stat strong{display:block;color:#166534;font-size:21px;margin-top:6px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;font-size:14px}th{background:#f8fafc}.tag{font-size:12px;color:#475569}#app{display:none}#msg{white-space:pre-wrap;margin-top:10px}.section{margin-top:20px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section class="card"><h1>Laporan Penjualan Kantin</h1><p class="muted">PPTQ Al-Ittihad Malakke · Ringkasan penjualan, produk terlaris, dan transaksi santri</p>
<div id="loginBox"><input id="email" type="email" placeholder="Email administrator"><input id="password" type="password" placeholder="Kata sandi"><button id="login">LOGIN ADMIN</button></div>
<div id="app"><p id="who"></p><button class="secondary" id="logout">KELUAR</button></div><div id="msg"></div></section>
<section id="report" class="card" style="display:none">
<h2>Periode Laporan</h2><div class="grid"><label>Dari tanggal<input type="date" id="from"></label><label>Sampai tanggal<input type="date" id="to"></label></div><div class="grid"><button id="load">TAMPILKAN LAPORAN</button><button class="secondary" id="csv">UNDUH CSV</button></div>
<div class="stats section"><div class="stat">Total penjualan<strong id="revenue">Rp0</strong></div><div class="stat">Jumlah transaksi<strong id="count">0</strong></div><div class="stat">Barang terjual<strong id="units">0</strong></div></div>
<div class="section"><h2>Produk Paling Laris</h2><div class="tablewrap"><table><thead><tr><th>Produk</th><th>Jumlah terjual</th><th>Nilai penjualan</th></tr></thead><tbody id="best"></tbody></table></div></div>
<div class="section"><h2>Riwayat Transaksi</h2><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Santri</th><th>Rincian barang</th><th>Petugas</th><th>Total</th></tr></thead><tbody id="history"></tbody></table></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://cpdkqqxvjfbcoucelhmr.supabase.co","sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2");
const el=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
let rows=[],items=[],students={},cashiers={};
function msg(t){el("msg").textContent=t}
function localDate(d){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data:p,error}=await db.from("profil_pengguna").select("nama,peran").eq("id",session.user.id).single();if(error||!p||p.peran!=="admin"){await db.auth.signOut();msg("Halaman laporan hanya dapat dibuka administrator.");return}el("loginBox").style.display="none";el("app").style.display="block";el("report").style.display="block";el("who").textContent="Login sebagai: "+p.nama;const now=new Date();el("to").value=localDate(now);el("from").value=localDate(new Date(now.getFullYear(),now.getMonth(),1));await loadReport()}
el("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(error){msg("Login gagal: "+error.message);return}await init()};
el("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadReport(){msg("Memuat laporan...");const from=el("from").value,to=el("to").value;if(!from||!to||from>to){msg("Periksa tanggal laporan.");return}const start=new Date(from+"T00:00:00").toISOString(),end=new Date(new Date(to+"T00:00:00").getTime()+86400000).toISOString();
const [tr,st,pr]=await Promise.all([db.from("transaksi_kantin").select("id,santri_id,transaksi_tabungan_id,petugas_id,jumlah,keterangan,tanggal").gte("tanggal",start).lt("tanggal",end).order("tanggal",{ascending:false}),db.from("santri").select("id,nama_lengkap,nis,kelas"),db.from("profil_pengguna").select("id,nama")]);
if(tr.error||st.error||pr.error){msg("Gagal memuat laporan: "+(tr.error||st.error||pr.error).message);return}
rows=tr.data||[];students=Object.fromEntries((st.data||[]).map(x=>[x.id,x]));cashiers=Object.fromEntries((pr.data||[]).map(x=>[x.id,x.nama]));
const ids=rows.map(x=>x.id);items=[];if(ids.length){const it=await db.from("transaksi_kantin_item").select("transaksi_kantin_id,nama_produk,harga_satuan,jumlah,subtotal").in("transaksi_kantin_id",ids);if(it.error){msg("Gagal memuat rincian barang: "+it.error.message);return}items=it.data||[]}
render();msg("Laporan berhasil dimuat.")}
function render(){const revenue=rows.reduce((s,x)=>s+Number(x.jumlah),0),units=items.reduce((s,x)=>s+Number(x.jumlah),0);el("revenue").textContent=money(revenue);el("count").textContent=rows.length;el("units").textContent=units;
const best={};items.forEach(x=>{if(!best[x.nama_produk])best[x.nama_produk]={qty:0,total:0};best[x.nama_produk].qty+=Number(x.jumlah);best[x.nama_produk].total+=Number(x.subtotal)});
el("best").innerHTML="";Object.entries(best).sort((a,b)=>b[1].qty-a[1].qty).forEach(([name,v])=>{const tr=document.createElement("tr");[name,v.qty,money(v.total)].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.append(td)});el("best").append(tr)});if(!Object.keys(best).length)el("best").innerHTML='<tr><td colspan="3">Belum ada rincian belanja pada periode ini.</td></tr>';
el("history").innerHTML="";rows.forEach(r=>{const tr=document.createElement("tr"),s=students[r.santri_id]||{},lines=items.filter(i=>i.transaksi_kantin_id===r.id).map(i=>i.nama_produk+" × "+i.jumlah).join(", ")||r.keterangan||"Transaksi QR";const vals=[new Date(r.tanggal).toLocaleString("id-ID"),(s.nama_lengkap||"Santri")+" ("+(s.nis||"-")+")",lines,cashiers[r.petugas_id]||"-",money(r.jumlah)];vals.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});el("history").append(tr)});if(!rows.length)el("history").innerHTML='<tr><td colspan="5">Belum ada transaksi pada periode ini.</td></tr>'}
el("load").onclick=loadReport;el("csv").onclick=()=>{if(!rows.length){msg("Tidak ada transaksi untuk diekspor.");return}const lines=[["Tanggal","Nama Santri","NIS","Rincian Barang","Petugas","Total Rupiah"].join(",")];rows.forEach(r=>{const s=students[r.santri_id]||{},detail=items.filter(i=>i.transaksi_kantin_id===r.id).map(i=>i.nama_produk+" x "+i.jumlah).join("; ");const vals=[new Date(r.tanggal).toLocaleString("id-ID"),s.nama_lengkap||"",s.nis||"",detail,cashiers[r.petugas_id]||"",r.jumlah];lines.push(vals.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","))});const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="laporan-kantin-"+el("from").value+"-sampai-"+el("to").value+".csv";a.click();URL.revokeObjectURL(url)};
init();
</script></body></html>
