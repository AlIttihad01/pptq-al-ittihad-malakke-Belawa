
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password Admin</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 4px 20px #0002;
    text-align: center;
}
h2 { color: #14532d; }
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}
button {
    width: 100%;
    padding: 12px;
    background: #166534;
    color: white;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}
#pesan { margin-top: 15px; }
</style>
</head>
<body>

<div class="box">
    <h2>PPTQ Al-Ittihad</h2>
    <p>Ganti Password Administrator</p>

    <form id="resetForm">
        <input type="password" id="password"
            placeholder="Password baru" minlength="8" required>

        <input type="password" id="konfirmasi"
            placeholder="Ulangi password baru" minlength="8" required>

        <button type="submit">SIMPAN PASSWORD</button>
    </form>

    <p id="pesan"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
    "https://cpdkqqxvjfbcoucelhmr.supabase.co",
    "sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2"
);

let siap = false;

async function periksaSesi() {
    const { data, error } = await supabaseClient.auth.getSession();

    siap = !error && !!data.session;

    if (!siap) {
        document.getElementById("pesan").textContent =
            "Tautan reset tidak valid atau sudah kedaluwarsa. Minta tautan baru.";
    }
}

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
        siap = true;
        document.getElementById("pesan").textContent =
            "Silakan masukkan password baru.";
    }
});

periksaSesi();

document.getElementById("resetForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const konfirmasi = document.getElementById("konfirmasi").value;
    const pesan = document.getElementById("pesan");

    if (password !== konfirmasi) {
        pesan.textContent = "Password tidak sama.";
        return;
    }

    if (!siap) {
        pesan.textContent = "Sesi reset belum tersedia. Gunakan tautan pemulihan terbaru.";
        return;
    }

    pesan.textContent = "Menyimpan password...";

    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    if (error) {
        pesan.textContent = "Gagal: " + error.message;
        return;
    }

    pesan.textContent = "Password berhasil diganti. Silakan login kembali.";
});
</script>

</body>
</html>
