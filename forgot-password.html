
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa Password Admin</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 4px 20px #0002;
    text-align: center;
}
h2 { color: #14532d; }
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}
button {
    width: 100%;
    padding: 12px;
    background: #166534;
    color: white;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}
#pesan { margin-top: 15px; }
</style>
</head>
<body>
<div class="box">
    <h2>PPTQ Al-Ittihad</h2>
    <p>Pemulihan Password Administrator</p>

    <form id="formLupa">
        <input type="email" id="email"
            placeholder="Email administrator" required>
        <button type="submit">KIRIM LINK RESET</button>
    </form>

    <p id="pesan"></p>
    <a href="admin.html">Kembali ke Login Admin</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
    "https://cpdkqqxvjfbcoucelhmr.supabase.co",
    "sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2"
);

document.getElementById("formLupa").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const pesan = document.getElementById("pesan");

    pesan.textContent = "Mengirim email pemulihan...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "https://alittihad01.github.io/pptq-al-ittihad-malakke-Belawa/reset-password.html"
    });

    if (error) {
        pesan.textContent = "Gagal mengirim: " + error.message;
    } else {
        pesan.textContent = "Permintaan diproses. Periksa email administrator, termasuk folder Spam.";
    }
});
</script>
</body>
</html>
