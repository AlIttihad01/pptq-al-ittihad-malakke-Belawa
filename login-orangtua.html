
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Orang Tua - PPTQ Al-Ittihad</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #166534;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        #pesan {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .gagal {
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>PPTQ Al-Ittihad</h2>
    <p>Login Orang Tua Santri</p>

    <form id="formLogin">
        <label>Alamat Email</label>
        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >

        <label>Kata Sandi</label>
        <input
            type="password"
            id="password"
            placeholder="Masukkan kata sandi"
            required
        >

        <button type="submit" id="tombolLogin">
            MASUK
        </button>
    </form>

    <p id="pesan"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://cpdkqqxvjfbcoucelhmr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xWB1iEsnGAZH7RB6yXIWsQ_lr4D0qx2";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("formLogin")
.addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const tombol = document.getElementById("tombolLogin");
    const pesan = document.getElementById("pesan");

    tombol.disabled = true;
    tombol.textContent = "MEMERIKSA...";
    pesan.textContent = "";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        pesan.textContent = "Login gagal. Periksa email dan kata sandi.";
        pesan.className = "gagal";
        tombol.disabled = false;
        tombol.textContent = "MASUK";
        return;
    }

    const tujuan = new URLSearchParams(window.location.search).get("next");
    window.location.href = tujuan === "bank-santri.html" ? "bank-santri.html" : "dashboard-orangtua.html";
});
</script>

</body>
</html>
